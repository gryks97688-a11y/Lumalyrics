
name: Build LumaLyrics for Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Mac app
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload downloadable Mac app
        uses: actions/upload-artifact@v4
        with:
          name: LumaLyrics-Apple-Silicon
          path: dist/*.dmg
          if-no-files-found: error
  
